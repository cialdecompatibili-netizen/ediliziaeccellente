    testo: "Demolizioni leggere, impianti, massetti, pavimenti in parquet e tinteggiatura: appartamento consegnato pronto all'uso."
  en:
    tipo: "Renovations"
    titolo: "Full apartment renovation"
    testo: "Light demolition, systems, screeds, wooden flooring and painting: apartment handed over ready to use."
